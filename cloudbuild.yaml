# Cloud Build — build & deploy OpenDoor to Cloud Run (Firebase Hosting via firebase deploy)
substitutions:
  _REGION: us-central1
  _REPO: opendoor
  _SITE_ID: opendoor-gcp
  _SQL_INSTANCE: opendoor-pg
  _VPC_CONNECTOR: opendoor-connector
  _TAG: latest
  _FILES_BUCKET: opendoor-files-800192c2
  _VERTEX_LOCATION: global
  _STRIPE_WEB_SEARCH_ADDON_PRICE_ID: price_1U5OPSBZaqY5cS2ZgTgkHNDX

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/dashboard/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_APP_URL=https://${_SITE_ID}.web.app
      - --build-arg
      - NEXT_PUBLIC_GATEWAY_URL=https://${_SITE_ID}.web.app
      - --build-arg
      - NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://${_SITE_ID}.web.app/callback
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:latest
      - .

  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/gateway/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:latest
      - .

  - id: push-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard
    waitFor: [build-dashboard]

  - id: push-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway
    waitFor: [build-gateway]

  - id: deploy-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CONN=$$(gcloud sql instances describe ${_SQL_INSTANCE} --format='value(connectionName)')
        VPC=${_VPC_CONNECTOR}
        OPENDOOR_FILES_BUCKET=${_FILES_BUCKET}
        VERTEX_LOCATION=${_VERTEX_LOCATION}
        # shellcheck disable=SC1091
        source infra/gcp/cloud-run-env.sh
        SECRETS=DATABASE_URL=opendoor-database-url:latest,REDIS_URL=opendoor-redis-url:latest,AUTH_SECRET=opendoor-auth-secret:latest,GATEWAY_API_KEY_HASH_SECRET=opendoor-gateway-hash-secret:latest,DB_PASSWORD=opendoor-db-password:latest
        # Always bind login + billing. Do not gate on `gcloud secrets describe` —
        # Cloud Build SA often cannot GET secrets, which dropped WorkOS/Stripe
        # from the running dashboard revision.
        SECRETS="$${SECRETS},WORKOS_API_KEY=opendoor-workos-api-key:latest,WORKOS_CLIENT_ID=opendoor-workos-client-id:latest,WORKOS_COOKIE_PASSWORD=opendoor-workos-cookie-password:latest,STRIPE_SECRET_KEY=opendoor-stripe-secret-key:latest"
        if gcloud secrets describe opendoor-together-api-key >/dev/null 2>&1; then
          SECRETS="$${SECRETS},TOGETHER_API_KEY=opendoor-together-api-key:latest"
        fi
        if gcloud secrets describe opendoor-qwen-api-key >/dev/null 2>&1; then
          SECRETS="$${SECRETS},QWEN_API_KEY=opendoor-qwen-api-key:latest"
        fi
        # Shared OpenBot computer token. Always bind; Cloud Build SA often cannot GET secrets.
        SECRETS="$${SECRETS},OPENBOT_COMPUTER_TOKEN=opendoor-openbot-computer-token:latest"
        SECRETS="$${SECRETS},INTERNAL_API_KEY=opendoor-internal-api-key:latest,GATEWAY_INTERNAL_KEY=opendoor-internal-api-key:latest"
        gcloud run deploy opendoor-gateway \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3001 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=1 \
          --max-instances=20 \
          --timeout=300 \
          --add-cloudsql-instances=$$CONN \
          --network=default \
          --subnet=default \
          --vpc-egress=private-ranges-only \
          --clear-vpc-connector \
          --set-env-vars="$$(opendoor_gateway_env $PROJECT_ID ${_REGION} $$CONN)" \
          --set-secrets=$$SECRETS
    waitFor: [push-gateway]

  - id: deploy-dashboard
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CONN=$$(gcloud sql instances describe ${_SQL_INSTANCE} --format='value(connectionName)')
        VPC=${_VPC_CONNECTOR}
        OPENDOOR_FILES_BUCKET=${_FILES_BUCKET}
        VERTEX_LOCATION=${_VERTEX_LOCATION}
        STRIPE_WEB_SEARCH_ADDON_PRICE_ID=${_STRIPE_WEB_SEARCH_ADDON_PRICE_ID}
        # shellcheck disable=SC1091
        source infra/gcp/cloud-run-env.sh
        SECRETS=DATABASE_URL=opendoor-database-url:latest,REDIS_URL=opendoor-redis-url:latest,AUTH_SECRET=opendoor-auth-secret:latest,GATEWAY_API_KEY_HASH_SECRET=opendoor-gateway-hash-secret:latest,DB_PASSWORD=opendoor-db-password:latest
        # Always bind login + billing. Cloud Build SA often cannot GET secrets.
        SECRETS="$${SECRETS},WORKOS_API_KEY=opendoor-workos-api-key:latest,WORKOS_CLIENT_ID=opendoor-workos-client-id:latest,WORKOS_COOKIE_PASSWORD=opendoor-workos-cookie-password:latest,STRIPE_SECRET_KEY=opendoor-stripe-secret-key:latest"
        if gcloud secrets describe opendoor-together-api-key >/dev/null 2>&1; then
          SECRETS="$${SECRETS},TOGETHER_API_KEY=opendoor-together-api-key:latest"
        fi
        if gcloud secrets describe opendoor-code-sandbox-token >/dev/null 2>&1; then
          SECRETS="$${SECRETS},CODE_SANDBOX_TOKEN=opendoor-code-sandbox-token:latest"
        fi
        if gcloud secrets describe opendoor-qwen-api-key >/dev/null 2>&1; then
          SECRETS="$${SECRETS},QWEN_API_KEY=opendoor-qwen-api-key:latest"
        fi
        # Shared OpenBot computer token. Always bind; Cloud Build SA often cannot GET secrets.
        SECRETS="$${SECRETS},OPENBOT_COMPUTER_TOKEN=opendoor-openbot-computer-token:latest"
        SECRETS="$${SECRETS},INTERNAL_API_KEY=opendoor-internal-api-key:latest,GATEWAY_INTERNAL_KEY=opendoor-internal-api-key:latest"
        gcloud run deploy opendoor-dashboard \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=20 \
          --timeout=300 \
          --add-cloudsql-instances=$$CONN \
          --network=default \
          --subnet=default \
          --vpc-egress=private-ranges-only \
          --clear-vpc-connector \
          --set-env-vars="$$(opendoor_dashboard_env $PROJECT_ID ${_REGION} $$CONN https://${_SITE_ID}.web.app)" \
          --set-secrets=$$SECRETS
    waitFor: [push-dashboard]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}

timeout: 1800s
