name: Deploy OpenDoor to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-opendoor-ocheingco
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/opendoor-gateway:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/opendoor-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/opendoor-dashboard:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/opendoor-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: |
            {
              "postgresAdminPassword": "${{ secrets.POSTGRES_ADMIN_PASSWORD }}",
              "authSecret": "${{ secrets.AUTH_SECRET }}",
              "apiKeyHashSecret": "${{ secrets.API_KEY_HASH_SECRET }}",
              "stripeSecretKey": "${{ secrets.STRIPE_SECRET_KEY }}",
              "stripeWebhookSecret": "${{ secrets.STRIPE_WEBHOOK_SECRET }}",
              "stripeProPriceId": "${{ secrets.STRIPE_PRO_PRICE_ID }}",
              "stripeEnterprisePriceId": "${{ secrets.STRIPE_ENTERPRISE_PRICE_ID }}",
              "appUrl": "https://${{ secrets.AZURE_FRONTDOOR_HOST }}"
            }
          failOnStdErr: false

      - name: Restart Gateway (Primary)
        run: |
          az containerapp revision restart \
            --name opendoor-primary-gateway \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restart Dashboard (Primary)
        run: |
          az containerapp revision restart \
            --name opendoor-primary-dashboard \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
