name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          bun run --cwd packages/shared typecheck
          bun run --cwd packages/database typecheck
          bun run --cwd packages/sdk typecheck
          bun run --cwd packages/analytics typecheck
          bun run --cwd apps/dashboard typecheck

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Production health
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://opendoor-gcp.web.app/health | grep -q '"status":"ok"'
          curl -fsS --max-time 20 https://opendoor-gcp.web.app/api/public/pricing | grep -q '"chat"'
