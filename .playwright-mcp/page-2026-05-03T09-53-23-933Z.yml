                  - text: "#"
              - paragraph [ref=e76]: "OpenDoor sits between your applications and various LLM providers (OpenAI, Azure AI Foundry, Anthropic, Mistral, Cohere, DeepSeek, and more), providing:"
              - list [ref=e77]:
                - listitem [ref=e78]:
                  - strong [ref=e79]: Unified API
                  - text: — One endpoint for all models, OpenAI-compatible
                - listitem [ref=e80]:
                  - strong [ref=e81]: Intelligent Routing
                  - text: — Automatic fallback across providers when one fails
                - listitem [ref=e82]:
                  - strong [ref=e83]: Model Catalog
                  - text: — 160+ models from top providers, with "live" and "available on request" status
                - listitem [ref=e84]:
                  - strong [ref=e85]: Usage Tracking
                  - text: — Per-request logging, token counting, and cost calculation
                - listitem [ref=e86]:
                  - strong [ref=e87]: Rate Limiting
                  - text: — API-key based rate limits with Redis-backed counters
                - listitem [ref=e88]:
                  - strong [ref=e89]: Admin Dashboard
                  - text: — Manage API keys, view usage, configure pricing
