              - paragraph [ref=e72]:
                - strong [ref=e73]: OpenDoor
                - text: is a multi-region LLM API Gateway built on Azure, designed to route requests across multiple AI providers with intelligent fallback chains, usage tracking, and cost management.
              - heading "What is OpenDoor?Direct link to What is OpenDoor?" [level=2] [ref=e74]:
