# Copy the public ComfyUI image into Artifact Registry, then deploy Cloud Run GPU.
# Prefer ./infra/gcp/deploy-comfy.sh (same outcome, plus IAM + app env).
substitutions:
  _REGION: us-central1
  _REPO: opendoor
  _SRC: docker.io/yanwk/comfyui-boot:cu130-slim-v2
  _SERVICE: opendoor-comfy

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s

steps:
  - id: copy-image
    name: gcr.io/go-containerregistry/gcrane
    args:
      - copy
      - ${_SRC}
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/comfy:cu130-slim-v2

  - id: deploy-comfy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/comfy:cu130-slim-v2
        gcloud run deploy ${_SERVICE} \
          --image=$$IMAGE \
          --region=${_REGION} \
          --platform=managed \
          --no-allow-unauthenticated \
          --port=8188 \
          --cpu=4 \
          --memory=16Gi \
          --gpu=1 \
          --gpu-type=nvidia-l4 \
          --no-gpu-zonal-redundancy \
          --no-cpu-throttling \
          --cpu-boost \
          --execution-environment=gen2 \
          --concurrency=1 \
          --min-instances=0 \
          --max-instances=1 \
          --timeout=600 \
          --startup-probe=tcpSocket.port=8188,periodSeconds=10,timeoutSeconds=5,failureThreshold=90,initialDelaySeconds=20 \
          --add-volume=name=comfy-models,type=cloud-storage,bucket=opendoor-comfy-models,readonly=true \
          --add-volume-mount=volume=comfy-models,mount-path=/mnt/comfy-models \
          --command=/bin/bash \
          --args=-c,bash /mnt/comfy-models/bootstrap.sh \
          --set-env-vars="^|^CLI_ARGS=--listen 0.0.0.0 --port 8188 --highvram --disable-mmap --extra-model-paths-config /mnt/comfy-models/extra_model_paths.yaml|COMFY_CHECKPOINT=v1-5-pruned-emaonly.safetensors"
        PROJECT_NUMBER=$$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} \
          --member="serviceAccount:$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
          --role="roles/run.invoker" \
          --quiet
