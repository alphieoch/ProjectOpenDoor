# Cloud Build trigger: push to main → cloudbuild.yaml (dashboard + gateway).
# 2nd-gen connection `github` in us-central1. After GitHub OAuth + App install:
#   gcloud builds repositories create ProjectOpenDoor \
#     --remote-uri=https://github.com/alphieoch/ProjectOpenDoor.git \
#     --connection=github --region=us-central1 \
#     --project=project-800192c2-3ecc-4889-8f7
#   gcloud builds triggers create github \
#     --trigger-config=infra/gcp/cloudbuild.trigger.yaml \
#     --region=us-central1 \
#     --project=project-800192c2-3ecc-4889-8f7
name: opendoor-main
description: Deploy dashboard + gateway to Cloud Run on push to main
filename: cloudbuild.yaml
includeBuildLogs: INCLUDE_BUILD_LOGS_WITH_STATUS
repositoryEventConfig:
  repository: projects/project-800192c2-3ecc-4889-8f7/locations/us-central1/connections/github/repositories/ProjectOpenDoor
  push:
    branch: ^main$
substitutions:
  _TAG: $SHORT_SHA
  _SITE_ID: opendoor-gcp
  _REGION: us-central1
  _REPO: opendoor
  _SQL_INSTANCE: opendoor-pg
  _VPC_CONNECTOR: opendoor-connector
