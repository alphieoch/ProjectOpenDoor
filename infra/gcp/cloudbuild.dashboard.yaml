# Rebuild + deploy dashboard (AuthKit / WorkOS + Cloud SQL)
substitutions:
  _REGION: us-central1
  _REPO: opendoor
  _SITE_ID: opendoor-gcp
  _TAG: latest
  _DEPLOY_PROJECT: project-800192c2-3ecc-4889-8f7
  _SQL_CONNECTION: project-800192c2-3ecc-4889-8f7:us-central1:opendoor-pg
  _VERTEX_LOCATION: global
  _STRIPE_WEB_SEARCH_ADDON_PRICE_ID: price_1U5OPSBZaqY5cS2ZgTgkHNDX

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/dashboard/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_APP_URL=https://${_SITE_ID}.web.app
      - --build-arg
      - NEXT_PUBLIC_GATEWAY_URL=https://${_SITE_ID}.web.app
      - --build-arg
      - NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://${_SITE_ID}.web.app/callback
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}
      - .

  - id: push-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}

  - id: deploy-dashboard
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}
        VERTEX_LOCATION=${_VERTEX_LOCATION}
        STRIPE_WEB_SEARCH_ADDON_PRICE_ID=${_STRIPE_WEB_SEARCH_ADDON_PRICE_ID}
        # shellcheck disable=SC1091
        source infra/gcp/cloud-run-env.sh
        SECRETS=DATABASE_URL=opendoor-database-url:latest,REDIS_URL=opendoor-redis-url:latest,AUTH_SECRET=opendoor-auth-secret:latest,GATEWAY_API_KEY_HASH_SECRET=opendoor-gateway-hash-secret:latest,DB_PASSWORD=opendoor-db-password:latest,WORKOS_API_KEY=opendoor-workos-api-key:latest,WORKOS_CLIENT_ID=opendoor-workos-client-id:latest,WORKOS_COOKIE_PASSWORD=opendoor-workos-cookie-password:latest
        if gcloud secrets describe opendoor-stripe-secret-key --project=${_DEPLOY_PROJECT} >/dev/null 2>&1; then
          SECRETS="$${SECRETS},STRIPE_SECRET_KEY=opendoor-stripe-secret-key:latest"
        fi
        if gcloud secrets describe opendoor-code-sandbox-token --project=${_DEPLOY_PROJECT} >/dev/null 2>&1; then
          SECRETS="$${SECRETS},CODE_SANDBOX_TOKEN=opendoor-code-sandbox-token:latest"
        fi
        SECRETS="$${SECRETS},OPENBOT_COMPUTER_TOKEN=opendoor-openbot-computer-token:latest"
        gcloud run deploy opendoor-dashboard \
          --project=${_DEPLOY_PROJECT} \
          --image=$$IMAGE \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=20 \
          --add-cloudsql-instances=${_SQL_CONNECTION} \
          --set-env-vars="$$(opendoor_dashboard_env ${_DEPLOY_PROJECT} ${_REGION} ${_SQL_CONNECTION} https://${_SITE_ID}.web.app)" \
          --set-secrets=$$SECRETS

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}

timeout: 1800s
