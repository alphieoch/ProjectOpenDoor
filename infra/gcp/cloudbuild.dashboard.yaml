# Rebuild + deploy dashboard (AuthKit / WorkOS + Cloud SQL)
substitutions:
  _REGION: us-central1
  _REPO: opendoor
  _SITE_ID: opendoor-f39a4
  _TAG: latest
  _DEPLOY_PROJECT: opendoor-f39a4
  _SQL_CONNECTION: project-800192c2-3ecc-4889-8f7:us-central1:opendoor-pg

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/dashboard/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_APP_URL=https://${_SITE_ID}.web.app
      - --build-arg
      - NEXT_PUBLIC_GATEWAY_URL=https://${_SITE_ID}.web.app
      - --build-arg
      - NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://${_SITE_ID}.web.app/callback
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}
      - .

  - id: push-dashboard
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}

  - id: deploy-dashboard
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}
        gcloud run deploy opendoor-dashboard \
          --project=${_DEPLOY_PROJECT} \
          --image=$$IMAGE \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=20 \
          --add-cloudsql-instances=${_SQL_CONNECTION} \
          --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${_DEPLOY_PROJECT},GCP_REGION=${_REGION},NEXT_PUBLIC_APP_URL=https://${_SITE_ID}.web.app,NEXT_PUBLIC_GATEWAY_URL=https://${_SITE_ID}.web.app,NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://${_SITE_ID}.web.app/callback,HOSTNAME=0.0.0.0,INSTANCE_CONNECTION_NAME=${_SQL_CONNECTION},DB_NAME=opendoor,DB_USER=opendoor \
          --set-secrets=DATABASE_URL=opendoor-database-url:latest,REDIS_URL=opendoor-redis-url:latest,AUTH_SECRET=opendoor-auth-secret:latest,GATEWAY_API_KEY_HASH_SECRET=opendoor-gateway-hash-secret:latest,DB_PASSWORD=opendoor-db-password:latest,WORKOS_API_KEY=opendoor-workos-api-key:latest,WORKOS_CLIENT_ID=opendoor-workos-client-id:latest,WORKOS_COOKIE_PASSWORD=opendoor-workos-cookie-password:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dashboard:${_TAG}

timeout: 1800s
