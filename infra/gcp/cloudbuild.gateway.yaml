# Build + push + deploy gateway only (dashboard image already in Artifact Registry)
substitutions:
  _REGION: us-central1
  _REPO: opendoor
  _SQL_INSTANCE: opendoor-pg
  _VPC_CONNECTOR: opendoor-connector
  _TAG: latest
  _FILES_BUCKET: opendoor-files-800192c2
  _VERTEX_LOCATION: global

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/gateway/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}
      - .

  - id: push-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}

  - id: deploy-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CONN=$$(gcloud sql instances describe ${_SQL_INSTANCE} --format='value(connectionName)')
        VPC=${_VPC_CONNECTOR}
        OPENDOOR_FILES_BUCKET=${_FILES_BUCKET}
        VERTEX_LOCATION=${_VERTEX_LOCATION}
        # shellcheck disable=SC1091
        source infra/gcp/cloud-run-env.sh
        SECRETS=DATABASE_URL=opendoor-database-url:latest,REDIS_URL=opendoor-redis-url:latest,AUTH_SECRET=opendoor-auth-secret:latest,GATEWAY_API_KEY_HASH_SECRET=opendoor-gateway-hash-secret:latest,DB_PASSWORD=opendoor-db-password:latest
        if gcloud secrets describe opendoor-together-api-key >/dev/null 2>&1; then
          SECRETS="$${SECRETS},TOGETHER_API_KEY=opendoor-together-api-key:latest"
        fi
        if gcloud secrets describe opendoor-stripe-secret-key >/dev/null 2>&1; then
          SECRETS="$${SECRETS},STRIPE_SECRET_KEY=opendoor-stripe-secret-key:latest"
        fi
        if gcloud secrets describe opendoor-workos-api-key >/dev/null 2>&1; then
          SECRETS="$${SECRETS},WORKOS_API_KEY=opendoor-workos-api-key:latest,WORKOS_CLIENT_ID=opendoor-workos-client-id:latest,WORKOS_COOKIE_PASSWORD=opendoor-workos-cookie-password:latest"
        fi
        # Required for OpenDoor Chat (dashboard → gateway). Always bind; do not
        # gate on `gcloud secrets describe` — Cloud Build SA often cannot GET secrets.
        SECRETS="$${SECRETS},INTERNAL_API_KEY=opendoor-internal-api-key:latest,GATEWAY_INTERNAL_KEY=opendoor-internal-api-key:latest"
        gcloud run deploy opendoor-gateway \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3001 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=1 \
          --max-instances=20 \
          --add-cloudsql-instances=$$CONN \
          --network=default \
          --subnet=default \
          --vpc-egress=private-ranges-only \
          --clear-vpc-connector \
          --set-env-vars="$$(opendoor_gateway_env $PROJECT_ID ${_REGION} $$CONN)" \
          --set-secrets=$$SECRETS

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}

timeout: 1800s
