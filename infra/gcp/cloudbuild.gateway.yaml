# Build + push + deploy gateway only (dashboard image already in Artifact Registry)
substitutions:
  _REGION: us-central1
  _REPO: opendoor
  _SQL_INSTANCE: opendoor-pg
  _VPC_CONNECTOR: opendoor-connector
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/gateway/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}
      - .

  - id: push-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}

  - id: deploy-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CONN=$$(gcloud sql instances describe ${_SQL_INSTANCE} --format='value(connectionName)')
        VPC=projects/$PROJECT_ID/locations/${_REGION}/connectors/${_VPC_CONNECTOR}
        SECRETS=DATABASE_URL=opendoor-database-url:latest,REDIS_URL=opendoor-redis-url:latest,AUTH_SECRET=opendoor-auth-secret:latest,GATEWAY_API_KEY_HASH_SECRET=opendoor-gateway-hash-secret:latest
        gcloud run deploy opendoor-gateway \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3001 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=1 \
          --max-instances=20 \
          --add-cloudsql-instances=$$CONN \
          --vpc-connector=$$VPC \
          --vpc-egress=private-ranges-only \
          --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GATEWAY_PORT=3001,INSTANCE_CONNECTION_NAME=$$CONN,DB_NAME=opendoor,DB_USER=opendoor \
          --set-secrets=DATABASE_URL=opendoor-database-url:latest,REDIS_URL=opendoor-redis-url:latest,AUTH_SECRET=opendoor-auth-secret:latest,GATEWAY_API_KEY_HASH_SECRET=opendoor-gateway-hash-secret:latest,DB_PASSWORD=opendoor-db-password:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}

timeout: 1800s
